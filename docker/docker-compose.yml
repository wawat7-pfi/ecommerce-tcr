services:
  wordpress:
    image: wordpress:php8.3-apache
    container_name: wp_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: wp_db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: cnp_
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
    volumes:
      - ../:/var/www/html
      - ./php-conf/zzz-custom.ini:/usr/local/etc/php/conf.d/zzz-custom.ini:ro
    networks:
      - wp_network

  elasticsearch:
    image: elasticsearch:8.17.0
    container_name: wp_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - wp_network

  kibana:
    image: kibana:8.17.0
    container_name: wp_kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://wp_elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - wp_network

volumes:
  es_data:

networks:
  wp_network:
    external: true
    name: wordpress_default